# nginx production (SF38): một domain duy nhất.
#   /          -> SPA React đã build (fallback index.html)
#   /api/      -> Django (gunicorn)
#   /admin/    -> Django admin
#   /static/   -> file tĩnh của Django admin (collectstatic)
# Cloudflare Tunnel (cloudflared) gọi vào http://web:80; HTTPS kết thúc ở Cloudflare.

# Giữ X-Forwarded-Proto=https mà Cloudflare gửi qua tunnel; gọi thẳng thì dùng scheme thật.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tunnel giữ IP người dùng trong header; truy cập trực tiếp dùng IP kết nối.
map $http_cf_connecting_ip $login_client_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $login_client_ip zone=login:10m rate=10r/m;

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    root /usr/share/nginx/html;

    # Lưu ý: location có add_header riêng sẽ KHÔNG kế thừa add_header của server,
    # nên phải lặp lại các header chung trong từng location có add_header.

    # File có hash trong tên do Vite sinh ra: cache lâu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Mọi đường dẫn khác trả index.html để router phía client xử lý.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

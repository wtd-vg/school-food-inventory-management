# nginx production (SF38, BE-17): một domain duy nhất.
#   /          -> SPA React đã build (fallback index.html), có CSP
#   /api/      -> Django (gunicorn)
#   /admin/    -> Django admin (không CSP; bảo vệ thêm bằng Cloudflare Access, docs/SECURITY.md)
#   /static/   -> file tĩnh của Django admin (collectstatic)
# Cloudflare Tunnel (cloudflared) gọi vào http://web:80; HTTPS kết thúc ở Cloudflare.
# Cổng web chỉ mở trên 127.0.0.1 của EC2, nên header CF-Connecting-IP chỉ đến từ Cloudflare
# (hoặc từ người có SSH vào máy chủ).

# Giữ X-Forwarded-Proto=https mà Cloudflare gửi qua tunnel; gọi thẳng thì dùng scheme thật.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# IP người dùng thật: CF-Connecting-IP do Cloudflare đặt; gọi thẳng (SSH tunnel) thì dùng IP kết nối.
# Django chỉ đọc X-Real-IP khi TRUST_PROXY_IP=true.
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Rate limit đăng nhập theo IP người dùng (không theo IP của cloudflared): 10 yêu cầu/phút.
limit_req_zone $client_real_ip zone=login:10m rate=10r/m;

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    # Header chung. Lưu ý: location có add_header riêng KHÔNG kế thừa add_header của server,
    # nên phải lặp lại các header chung trong từng location có add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # 429 của nginx trả JSON cùng định dạng lỗi API để màn đăng nhập hiện đúng thông báo.
    location @login_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        return 429 '{"message": "Đăng nhập quá nhiều lần, thử lại sau 1 phút."}';
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Django admin dùng script/style inline riêng nên không gắn CSP của SPA.
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    root /usr/share/nginx/html;

    # CSP của SPA: chỉ tài nguyên cùng origin (font tự host trong /fonts), không script inline.
    # style-src cần 'unsafe-inline' vì React đặt thuộc tính style (thanh tiến độ, biểu đồ).
    set $spa_csp "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    set $spa_permissions "camera=(), microphone=(), geolocation=(), payment=(), usb=()";

    # File có hash trong tên do Vite sinh ra: cache lâu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy $spa_permissions always;
    }

    # Mọi đường dẫn khác trả index.html để router phía client xử lý.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy $spa_permissions always;
    }
}

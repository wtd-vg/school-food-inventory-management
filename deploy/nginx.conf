# nginx production (SF38): một domain duy nhất.
#   /          -> SPA React đã build (fallback index.html)
#   /api/      -> Django (gunicorn)
#   /admin/    -> Django admin
#   /static/   -> file tĩnh của Django admin (collectstatic)
# Cloudflare Tunnel (cloudflared) gọi vào http://web:80; HTTPS kết thúc ở Cloudflare.

# Giữ X-Forwarded-Proto=https mà Cloudflare gửi qua tunnel; gọi thẳng thì dùng scheme thật.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    root /usr/share/nginx/html;

    # Lưu ý: location có add_header riêng sẽ KHÔNG kế thừa add_header của server,
    # nên phải lặp lại hai header bảo mật ở đây.

    # File có hash trong tên do Vite sinh ra: cache lâu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Mọi đường dẫn khác trả index.html để router phía client xử lý.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}

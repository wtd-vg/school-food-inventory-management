# Production (SF38). Chạy độc lập, KHÔNG gộp với compose.yaml:
#   docker compose --env-file .env.prod -f compose.prod.yaml --profile tunnel up -d --build
# Biến môi trường: xem .env.prod.example. File .env.prod không được commit.
name: schoolfood-prod

services:
  # PostgreSQL 17, không publish cổng ra ngoài; chỉ backend trong mạng nội bộ gọi được.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Django + gunicorn.
  backend:
    build:
      context: .
      target: backend-prod
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Thiếu SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Thiếu ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Thiếu CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # nginx: SPA + chuyển /api, /admin sang backend.
  # Chỉ mở cổng trên 127.0.0.1 để thử bằng SSH tunnel; người dùng đi vào qua Cloudflare Tunnel.
  web:
    build:
      context: .
      target: web-prod
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Cloudflare Tunnel: kết nối ra ngoài, không cần mở cổng 80/443 trên EC2.
  # Chỉ chạy khi thêm --profile tunnel (máy local thử không cần token).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Thiếu TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  postgres_data:

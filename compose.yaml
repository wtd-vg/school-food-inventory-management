# Chạy toàn bộ môi trường local bằng lệnh: docker compose up --build
services:
  # PostgreSQL lưu dữ liệu của dự án.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolfood}
      POSTGRES_USER: ${POSTGRES_USER:-schoolfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolfood}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Docker dùng lệnh này để biết PostgreSQL đã sẵn sàng nhận kết nối.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolfood} -d ${POSTGRES_DB:-schoolfood}"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Django cung cấp API tại http://localhost:8000.
  backend:
    build:
      context: .
      target: backend
    environment:
      DB_NAME: ${POSTGRES_DB:-schoolfood}
      DB_USER: ${POSTGRES_USER:-schoolfood}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-schoolfood}
      DB_HOST: db
      DB_PORT: "5432"
    # Chỉ khởi động Django sau khi PostgreSQL vượt qua healthcheck ở trên.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Vite cung cấp giao diện React tại http://localhost:5173.
  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

# Volume giữ dữ liệu khi container dừng hoặc được tạo lại.
volumes:
  postgres_data:
  frontend_node_modules:
